title = "Authentic Morrowind"
short_description = "Modern but authentic interpretation of Morrowind"
description = "<p>This list imagines Morrowind as it might have looked and felt if its developers had had unlimited time and resources in 2002. It runs on OpenMW at a classic 4:3 aspect ratio and builds on the I Heart Vanilla: Director’s Cut foundation, keeping the original visual identity while adding modern shaders, clearer textures, and quality-of-life improvements. The aim is to realize Morrowind’s retro design more fully. The list favors consistency with the base game, following the design philosophy of projects like Tamriel Rebuilt. Smaller refits improve existing locations, and OAAB Data is used sparingly in favor of Tamriel Data.</p><p>Mods like Morrowind Enhanced Textures, various upscales, Animated Trees, Rafael’s Shader Pack, and Devilish Snow/Ash enhance the world without changing its art direction.</p><p>Cities/towns and landmarks get light touch-ups rather than rebuilds. Concept Art Palace and Concept Art Hlaalu Balconies bring places like Vivec’s palace and Hlaalu architecture closer to the game’s concept art, while Verdant Bitter Coast Fern Trees, Azura CC, Shabby Seyda Neen, Caldera Palisade and Unique Uniques fix vanilla content that didn’t feel as unique when compared to Tamriel Rebuilt content.</p><p>The original HUD and UI style stays intact but improved. Controller Interface Overhaul, QuickSelect Ultimate, HUD Markers, Larger Minimap, and BetterBars improve functionality, especially with a controller and the narrower aspect ratio. Animation and combat get similar treatment with Dynamic Animations, Animated Lanterns and Signs, and Hit Reactions Animated. These mods add life to the game without replacing existing animations, while Dynamic Camera, Hit and Miss Indicators, Mercy AI, and Take Cover add responsiveness to combat.</p><p>NPCs and dialogue are better realized with NPC Overhaul, Repopulated Creatures, Protective Guards, Faction Voiced Greetings, and the FMI/LDM dialogue fixes.</p><p>Balance changes are light: State-Based HP and Magicka Regen, Rest and Sleep Recovery, Speechcraft Rebalance, Slower Level Up, and the Tribunal and Bloodmoon rebalances, plus Morrowind Anti-Cheese.</p><p>Morrowind’s sound effects are central to its retro aesthetic, so replacements are minimal. Dynamic Sounds, S3maphore, Aaron’s Ambient Rain and Thunder Replacers, and Maxar’s Dynamic Footsteps add ambience and reduce the annoyance of frequently repeated sounds like rain and footsteps.</p>"

